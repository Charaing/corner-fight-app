<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>코너 격투기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23111'/%3E%3Cpath d='M38 14h10L30 50H20z' fill='%23D20A0A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F2; --surface:#FFFFFF; --surface-2:#F2F2F2; --ink:#111111; --ink-2:#3B3B3B; --muted:#767676;
  --line:#E0E0E0; --line-2:#111111; --red:#D20A0A; --red-soft:#FBE8E8; --blue:#1D4ED8; --blue-soft:#E7EDFC;
  --gold:#9A6B00; --gold-soft:#F5EEDC; --win:#0E7A3E; --live:#D20A0A;
  --tabbar:#FFFFFF; --sheet:#FFFFFF; --scrim:rgba(0,0,0,.45); --hero:#111111;
  --r-lg:0; --r-md:0; --r-sm:0;
  --f-display:'Barlow Condensed','Noto Sans KR',sans-serif; --f-body:'Noto Sans KR',-apple-system,system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0A0A; --surface:#151515; --surface-2:#1E1E1E; --ink:#F3F3F3; --ink-2:#C6C6C6; --muted:#8C8C8C;
  --line:#2A2A2A; --line-2:#F3F3F3; --red:#FF2A2A; --red-soft:rgba(255,42,42,.13); --blue:#7193FF; --blue-soft:rgba(113,147,255,.14);
  --gold:#D9A53F; --gold-soft:rgba(217,165,63,.13); --win:#36C27B; --live:#FF2A2A; --tabbar:#111111; --sheet:#151515; --scrim:rgba(0,0,0,.6); --hero:#000000;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A0A0A; --surface:#151515; --surface-2:#1E1E1E; --ink:#F3F3F3; --ink-2:#C6C6C6; --muted:#8C8C8C;
  --line:#2A2A2A; --line-2:#F3F3F3; --red:#FF2A2A; --red-soft:rgba(255,42,42,.13); --blue:#7193FF; --blue-soft:rgba(113,147,255,.14);
  --gold:#D9A53F; --gold-soft:rgba(217,165,63,.13); --win:#36C27B; --live:#FF2A2A; --tabbar:#111111; --sheet:#151515; --scrim:rgba(0,0,0,.6); --hero:#000000;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{max-width:560px;margin:0 auto;min-height:100%;position:relative;padding-bottom:calc(70px + var(--safe-b));background:var(--bg)}
main{padding-top:4px}

/* ── 상단 바: 흰 바탕, 워드마크, 빨간 밑줄 */
.topbar{position:sticky;top:0;z-index:20;padding:calc(0px + var(--safe-t)) 16px 0;height:calc(56px + var(--safe-t));background:var(--surface);display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-style:italic;font-size:27px;letter-spacing:-.01em;line-height:1;text-transform:uppercase;display:flex;align-items:center;gap:6px;position:relative;padding-bottom:2px}
.brand i{display:block;width:6px;height:20px;background:var(--red);transform:skewX(-14deg)}
.topbar .mini{display:none}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;margin-left:auto}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--win)}
.sync.err .dot{background:var(--gold)}
.sync.busy .dot{animation:pulse 1s infinite}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{border-color:var(--ink)}
.icon-btn svg{width:16px;height:16px}
.icon-btn.spin svg{animation:spin .8s linear infinite}
h1.large{font-family:var(--f-body);font-size:30px;line-height:1.15;font-weight:900;letter-spacing:-.03em;margin:22px 16px 14px;position:relative;padding-bottom:12px}
h1.large::after{content:"";position:absolute;left:0;bottom:0;width:34px;height:3px;background:var(--red)}
.sub{color:var(--muted);font-size:13px;margin:-4px 16px 16px}

/* ── 필터: 각진 버튼 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:0 16px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 13px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;scroll-snap-align:start;transition:border-color .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.chip .n{font-family:var(--f-display);font-weight:600;font-size:14px;opacity:.55}
.chips.years{border-bottom:1px solid var(--line);margin:0 16px 12px;padding:0;gap:0}
.chips.years .chip{font-family:var(--f-display);font-size:18px;font-weight:700;padding:0 12px;height:40px;border:0;background:none;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.chips.years .chip[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--red);background:none}
.seg{display:flex;margin:0 16px 16px;gap:6px}
.seg button{flex:1;height:40px;font-size:14px;font-weight:700;color:var(--ink);border:1.5px solid var(--ink);background:var(--surface);letter-spacing:.01em}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* ── 섹션/리스트 */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 16px 10px}
.section-h h2{font-size:19px;font-weight:900;margin:0;letter-spacing:-.02em}
.section-h span{font-size:12.5px;color:var(--muted)}
.section-h button.s{font-weight:700;color:var(--ink)!important;border-bottom:2px solid var(--red);font-size:13px!important}
.group{margin:0 16px;background:var(--surface);border-top:2px solid var(--line-2)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;position:relative}
.row+.row{border-top:1px solid var(--line)}
.row+.row::before{display:none}
button.row:hover{background:var(--surface-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:700;font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;letter-spacing:-.01em}
.row .s{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.chev{width:7px;height:12px;flex:none;color:var(--muted)}
.datebox{width:42px;flex:none;text-align:center;line-height:1}
.datebox b{display:block;font-family:var(--f-display);font-size:28px;font-weight:700}
.datebox small{font-size:11px;color:var(--muted);font-weight:500}
.org{display:inline-flex;align-items:center;height:18px;padding:0 5px;font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#2A2A2A;flex:none;vertical-align:1px}
.org.ufc{background:#D20A0A}.org.pfl{background:#111;color:#E2BE55}.org.bellator{background:#3A3A3A}.org.rizin{background:#C8006E}.org.bc{background:#111;color:#fff;box-shadow:inset 3px 0 0 #D20A0A;padding-left:7px}.org.boxing{background:#8A6410}.org.one{background:#111;color:#F4C430}
.month{font-family:var(--f-body);font-size:12px;font-weight:700;color:var(--muted);margin:22px 16px 8px;letter-spacing:.02em}
.empty{margin:24px 16px;padding:30px 18px;text-align:center;color:var(--muted);background:var(--surface);border-top:2px solid var(--line-2);font-size:14px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.empty button{margin-top:14px;height:38px;padding:0 18px;background:var(--ink);color:var(--surface);font-weight:700;font-size:14px}
.skeleton{height:62px;margin:0 16px 6px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:shimmer 1.2s infinite}

/* ── 이름 표시: 유명 선수 = 빨간 사선, 챔피언 = C 배지 */
.fname{display:inline}
.mark{display:inline-block;width:4px;height:.78em;background:var(--red);transform:skewX(-14deg);margin-left:5px;vertical-align:-.04em}
.tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--red);vertical-align:1px;white-space:nowrap;letter-spacing:.01em}
.belt{display:inline-grid;place-items:center;width:15px;height:15px;margin-left:5px;background:var(--ink);color:var(--surface);font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:11px;line-height:1;vertical-align:1px}
.win{color:var(--win);font-weight:700}
.mthd{display:inline-flex;align-items:center;height:20px;padding:0 6px;font-size:11.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.mthd.ko{background:var(--red-soft);color:var(--red)}.mthd.sub{background:var(--blue-soft);color:var(--blue)}
.mthd.title{background:var(--ink);color:var(--surface)}
.tt{color:var(--ink);font-weight:800}
.tt::before,.lgd::before{content:"";display:inline-block;width:3px;height:.8em;background:var(--red);margin-right:5px;vertical-align:-.05em}
.lgd{color:var(--gold);font-weight:700}
.lgd::before{background:var(--gold)}
.live{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;background:var(--live);color:#fff;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em}
.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;animation:pulse 1.1s infinite}

/* ── 메인 포스터 */
.poster{margin:0 16px;overflow:hidden;position:relative;color:#fff;background:var(--hero);isolation:isolate;width:calc(100% - 32px);text-align:left;display:block}
.poster .halves{position:absolute;inset:0;z-index:-1}
.poster .halves::before,.poster .halves::after{content:"";position:absolute;inset:0}
.poster .halves::before{background:linear-gradient(90deg,rgba(210,10,10,.55),transparent 55%)}
.poster .halves::after{background:linear-gradient(270deg,rgba(29,78,216,.45),transparent 55%)}
.poster .grain{display:none}
.poster .top{display:flex;align-items:center;gap:8px;padding:16px 16px 0;font-size:12.5px;font-weight:500;flex-wrap:wrap}
.poster .top .when{opacity:.85;margin-left:auto}
.poster .faces{display:grid;grid-template-columns:1fr 1fr;align-items:end;height:210px;margin-top:4px}
.poster .face{position:relative;height:100%;display:flex;align-items:flex-end}
.poster .face img{height:100%;width:auto;max-width:none;object-fit:contain;position:absolute;bottom:0}
.poster .face.a img{left:-4%}.poster .face.b img{right:-4%;transform:scaleX(-1)}
.poster .face .ph{position:absolute;bottom:18px;font-family:var(--f-display);font-weight:800;font-size:92px;line-height:.8;opacity:.15}
.poster .face.a .ph{left:14px}.poster .face.b .ph{right:14px}
.poster .vs{position:absolute;left:50%;top:140px;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.04em;opacity:.9}
.poster .names{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:0 16px;align-items:end;margin-top:-30px;position:relative}
.poster .nm{font-family:var(--f-display);font-weight:800;line-height:.88;text-transform:uppercase;min-width:0}
.poster .nm .sur{display:block;white-space:nowrap;font-size:44px}
.poster .nm small{display:block;font-family:var(--f-body);text-transform:none;font-size:12px;font-weight:500;opacity:.85;margin-top:6px;line-height:1.35}
.poster .nm.b{text-align:right;grid-column:3}
.poster .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:16px;margin-top:12px;border-top:1px solid rgba(255,255,255,.14);background:rgba(0,0,0,.35)}
.poster .ev{font-size:12.5px;opacity:.85;line-height:1.45;min-width:0}
.poster .ev b{display:block;font-size:15px;opacity:1;font-weight:700}
.poster .slot{font-weight:700;padding:1px 0;border-bottom:2px solid #fff}
.poster .slot.gold{border-bottom-color:var(--red);color:#fff}
.count{display:flex;gap:2px;font-family:var(--f-display);font-weight:700;flex:none}
.count div{min-width:40px;text-align:center;padding:5px 4px 3px;background:rgba(255,255,255,.1)}
.count b{display:block;font-size:24px;line-height:1}
.count small{font-family:var(--f-body);font-size:10px;font-weight:500;opacity:.75}
.poster.is-live .count{display:none}

/* ── 경기 카드(시트) */
.fight{padding:16px 14px;position:relative}
.fight+.fight{border-top:1px solid var(--line)}
.fight .meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px;flex-wrap:wrap}
.fight .meta .wc{font-weight:700;color:var(--ink)}
.vsrow{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:8px}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;text-align:center}
.vsrow .avatar{width:58px;height:58px}
.avatar{width:46px;height:46px;flex:none;border-radius:50%;background:var(--surface-2);overflow:hidden;position:relative;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--muted)}
.avatar img{width:130%;height:130%;object-fit:cover;object-position:50% 8%;position:absolute;top:0;left:-15%}
.side.a .avatar{box-shadow:inset 0 -3px 0 var(--red)}.side.b .avatar{box-shadow:inset 0 -3px 0 var(--blue)}
.side .who{min-width:0}
.side .nm{font-weight:700;font-size:14px;line-height:1.3}
.side .rec{font-family:var(--f-display);font-size:15px;color:var(--muted);font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.side .rec img{width:16px;height:11px;object-fit:cover}
.side.lost{opacity:.45}
.vsmid{text-align:center;font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:15px}
.wflag{display:inline-block;font-size:10.5px;font-weight:700;color:#fff;background:var(--win);padding:0 5px;margin-left:4px;vertical-align:1px}
.result{margin-top:12px;display:flex;justify-content:center;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.legend-ribbon{position:absolute;right:14px;top:14px;font-size:11px;font-weight:700;color:var(--gold)}

/* ── 레전드 타임라인 */
.tl{margin:0 16px;position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl-year{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;margin:24px 0 10px -20px;padding-left:20px;position:relative}
.tl-year::before{content:"";position:absolute;left:0;top:50%;width:9px;height:9px;background:var(--red);transform:translateY(-50%)}
.lg{background:var(--surface);border-top:2px solid var(--line-2);padding:16px 14px;margin-bottom:10px;width:100%;text-align:left;display:block;position:relative}
.lg:hover{background:var(--surface-2)}
.lg .hook{font-family:var(--f-body);font-weight:900;font-size:21px;line-height:1.2;letter-spacing:-.02em;color:var(--ink);margin:6px 0 8px}
.lg .lm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.lg .bout{font-size:14.5px;font-weight:600;line-height:1.4}
.lg .bout .def{color:var(--muted);font-weight:400;margin:0 4px}
.lg .story{font-size:14px;color:var(--ink-2);margin-top:6px;line-height:1.65}
.lg .ft{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* ── 선수 */
.search{margin:0 16px 12px;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 38px;font:inherit;font-size:16px;color:var(--ink);border-radius:0}
.search input:focus{outline:none;border-color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.search svg{position:absolute;left:12px;top:13px;width:18px;height:18px;color:var(--muted)}
.fav{width:34px;height:34px;display:grid;place-items:center;flex:none;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--red)}
.fav svg{width:19px;height:19px}

/* ── 시트 */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:50;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;height:calc(100% - 40px - var(--safe-t));background:var(--sheet);z-index:51;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;border-top:3px solid var(--red)}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;background:var(--line);margin:7px auto 0;flex:none}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:6px 12px 10px 16px;flex:none;border-bottom:1px solid var(--line)}
.sheet .sh .ttl{flex:1;font-weight:800;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .body{overflow-y:auto;flex:1;padding:6px 0 calc(24px + var(--safe-b));overscroll-behavior:contain}
.sheet .group{border-top-width:1px;border-top-color:var(--line)}
.sheet .hero{padding:10px 16px 16px}
.sheet .hero h3{font-size:24px;font-weight:900;line-height:1.25;margin:8px 0 4px;letter-spacing:-.02em}
.sheet .hero p{margin:0;color:var(--muted);font-size:13.5px}
.card-sec{font-size:12px;font-weight:800;color:var(--ink);margin:24px 16px 8px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.card-sec::before{content:"";width:3px;height:12px;background:var(--red)}
.pf{display:flex;gap:16px;align-items:center;padding:12px 16px 16px}
.pf .avatar{width:88px;height:88px;font-size:30px}
.pf h3{margin:0;font-size:25px;font-weight:900;line-height:1.2;letter-spacing:-.02em}
.pf .nick{color:var(--muted);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:0 16px;background:var(--line);border:1px solid var(--line)}
.stat{background:var(--surface);padding:11px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.stat small{color:var(--muted);font-size:11.5px}
.note{margin:12px 16px 0;padding:12px 14px;background:var(--surface-2);border-left:3px solid var(--ink);color:var(--ink);font-size:14px;line-height:1.65}
.champ-note{border-left-color:var(--red);font-weight:700}
.pf-actions{display:flex;gap:8px;margin:0 16px 16px}
.pf-actions .chip{height:38px;font-weight:700}

/* ── 탭바: 모바일 하단 */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:0 auto;z-index:30;background:var(--tabbar);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:0 0 var(--safe-b)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);padding:8px 0 7px;border-top:2px solid transparent;margin-top:-1px}
.tabbar svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink);border-top-color:var(--red)}
.view{display:none}.view.on{display:block;animation:viewin .2s ease}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translate(-50%,16px);background:var(--ink);color:var(--surface);font-size:13.5px;font-weight:600;padding:11px 16px;opacity:0;pointer-events:none;transition:.22s;z-index:60;white-space:nowrap;border-left:3px solid var(--red)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin:30px 16px 8px;font-size:12px;color:var(--muted);line-height:1.6}

/* ── 인기 매치 */
.pop{display:flex;gap:10px;overflow-x:auto;padding:0 16px 6px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.pop::-webkit-scrollbar{display:none}
.strip{position:relative}
.strip .nav{display:none}
.dragging{cursor:grabbing;scroll-snap-type:none!important;user-select:none}
.dragging *{pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .pop,.chips{cursor:grab}
  .strip .nav{display:grid;place-items:center;position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:40px;height:40px;background:var(--ink);color:var(--surface);transition:background .15s}
  .strip .nav:hover{background:var(--red)}
  .strip .nav svg{width:18px;height:18px}
  .strip .nav.prev{left:0}.strip .nav.next{right:0}
  .strip .nav[hidden]{display:none}
}
.pc{flex:none;width:240px;scroll-snap-align:start;background:var(--surface);border-top:2px solid var(--line-2);padding:12px 12px 14px;text-align:left;display:flex;flex-direction:column}
.pc:hover{background:var(--surface-2)}
.pc .pm{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:12px;white-space:nowrap;overflow:hidden}
.pc .duo{display:grid;grid-template-columns:1fr 26px 1fr;align-items:start;text-align:center;flex:1}
.pc .duo .avatar{margin:0 auto 8px;width:64px;height:64px}
.pc .duo>div:first-child .avatar{box-shadow:inset 0 -3px 0 var(--red)}.pc .duo>div:last-child .avatar{box-shadow:inset 0 -3px 0 var(--blue)}
.pc .duo .n{font-size:13px;font-weight:700;line-height:1.3}
.pc .duo .r{font-family:var(--f-display);font-size:14px;font-weight:600;color:var(--muted);margin-top:2px}
.pc .duo .vs{font-family:var(--f-display);font-weight:700;color:var(--muted);padding-top:22px}
.pc .duo .lost{opacity:.4}
.pc .foot2{margin-top:10px;display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.avatar img.wk{width:100%;height:100%;left:0;top:0;object-fit:cover;object-position:50% 18%}
.avatar img:not([src]){display:none}
.avatar img.sd,.poster .face img.sd{max-width:100%;width:100%;height:100%;left:0;top:0;object-fit:cover;object-position:50% 15%}

/* ── 챔피언: 체급별 칸 */
.cgrid{display:grid;grid-template-columns:1fr;gap:0;margin:0 16px}
.cgroup{font-family:var(--f-body);font-weight:900;font-size:19px;letter-spacing:-.02em;margin:30px 16px 0;display:flex;align-items:baseline;gap:8px}
.cgroup small{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.ccol{background:var(--surface);border-top:2px solid var(--line-2);margin-top:12px;display:flex;flex-direction:column}
.chead{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;padding:14px 0 0 14px;border-bottom:1px solid var(--line);min-height:142px;text-align:left;width:100%;position:relative;overflow:hidden}
.chead:hover .cn{color:var(--red)}
.chead .cdiv{font-size:13px;font-weight:800;color:var(--red);letter-spacing:.01em}
.chead .cn{font-family:'Barlow Condensed','Noto Sans KR',sans-serif;font-weight:800;font-size:29px;line-height:.95;text-transform:uppercase;margin-top:10px;transition:color .15s}
.chead .ck{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:600}
.chead .cmeta{font-family:'Barlow Condensed',sans-serif;font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:10px 0 14px}
.chead .cimg{width:150px;height:128px;align-self:end;position:relative}
.chead .cimg img{position:absolute;right:0;bottom:0;height:100%;width:auto;max-width:none;object-fit:contain}
.chead .cimg img.round{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 15%;right:16px;bottom:16px}
.chead .cimg .ini{position:absolute;right:16px;bottom:16px;width:96px;height:96px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:38px;color:var(--muted)}
.chead.vacant .cn{color:var(--muted)}
.rk{list-style:none;margin:0;padding:4px 0 8px}
.rk li button{display:grid;grid-template-columns:minmax(26px,auto) 1fr auto;align-items:center;gap:8px;width:100%;padding:8px 14px;text-align:left;font-size:13.5px}
.rk li button:hover{background:var(--surface-2)}
.rk .no{font-family:var(--f-display);font-weight:800;font-size:15px}
.rk .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .ch{font-family:var(--f-display);font-weight:700;font-size:13px;display:flex;align-items:center;gap:3px}
.rk .ch.up{color:var(--win)}.rk .ch.dn{color:var(--red)}
.rk .ch.up::before{content:"";border:5px solid transparent;border-bottom:6px solid currentColor;border-top:0}
.rk .ch.dn::before{content:"";border:5px solid transparent;border-top:6px solid currentColor;border-bottom:0}
.rk-more{font-size:12.5px;font-weight:700;color:var(--ink);padding:6px 14px 12px;text-align:left;border-top:1px solid var(--line);padding-top:10px}
.bo{display:inline-grid;place-items:center;min-width:46px;height:22px;padding:0 4px;font-family:var(--f-display);font-weight:700;font-size:13.5px;background:var(--surface-2);color:var(--ink-2);flex:none}
.bo.ring{background:var(--ink);color:var(--surface)}
.cbelts{padding:4px 0}
.cbelts .row{padding:10px 14px}

/* ── 뉴스 */
.news-lead{margin:0 16px;display:block;background:var(--surface);border-top:2px solid var(--line-2)}
.news-lead .im{aspect-ratio:16/9;background:var(--surface-2);overflow:hidden;max-width:100%}
.news-lead .im img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.news-lead:hover .im img{transform:scale(1.03)}
.news-lead .tx{padding:14px 14px 18px}
.news-lead h3{margin:6px 0 0;font-size:22px;font-weight:900;line-height:1.3;letter-spacing:-.02em}
.nk{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--red);display:flex;gap:8px;align-items:center}
.nk time{color:var(--muted);font-weight:600;letter-spacing:.04em}
.news-list{margin:14px 16px 0;background:var(--surface);border-top:2px solid var(--line-2)}
.nrow{display:grid;grid-template-columns:28px 1fr 104px;gap:12px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.nrow:hover{background:var(--surface-2)}
.nrow .nn{width:28px;height:28px;display:grid;place-items:center;background:var(--red);color:#fff;font-family:var(--f-display);font-weight:800;font-size:17px;align-self:start}
.nrow h4{margin:3px 0 0;font-size:15px;font-weight:700;line-height:1.4;letter-spacing:-.01em}
.nrow .im{width:104px;aspect-ratio:16/10;background:var(--surface-2);overflow:hidden}
.nrow .im img{width:100%;height:100%;object-fit:cover}

/* ── 선수 상세 기록 */
.bio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;margin:0 16px;background:var(--line);border:1px solid var(--line)}
.bio div{background:var(--surface);padding:9px 11px;min-width:0}
.bio small{display:block;font-size:11px;color:var(--muted)}
.bio b{display:block;font-size:13.5px;font-weight:700;margin-top:2px;line-height:1.35;overflow-wrap:anywhere}
.brkwrap{margin:0 16px;border:1px solid var(--line);padding:14px 14px 4px}
.brk{margin-bottom:14px}
.brk .bh{display:flex;align-items:baseline;gap:6px;margin-bottom:7px}
.brk .bh b{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1}
.brk .bh span{font-size:13px;color:var(--muted);font-weight:700}
.brk.w .bh b{color:var(--ink)}.brk.l .bh b{color:var(--red)}
.bar{display:flex;height:8px;overflow:hidden;background:var(--surface-2);gap:2px}
.bar i{display:block;height:100%}
.bl{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:12px;color:var(--ink-2)}
.bl i{display:inline-block;width:8px;height:8px;margin-right:5px;vertical-align:0}
.bar .ko,.bl .ko{background:var(--red)}.bar .sub,.bl .sub{background:var(--blue)}.bar .dec,.bl .dec{background:var(--muted)}
.brk-o{margin:0 0 12px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.stats.st4 .stat b{font-size:23px}
.stat .of{font-size:15px;color:var(--muted);font-weight:600}
@media (max-width:360px){.bio{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ── 데스크톱: 위쪽 내비게이션, 넓은 그리드 */
@media (min-width:900px){
  .app{max-width:1180px;padding-bottom:40px}
  .topbar{padding:0 24px;height:64px;gap:28px}
  .brand{font-size:31px}
  .tabbar{position:static;max-width:none;margin:0;background:none;border:0;display:flex;gap:4px;padding:0;height:100%;align-items:stretch}
  .tabbar button{flex-direction:row;font-size:15px;font-weight:700;color:var(--ink-2);padding:0 14px;border-top:0;border-bottom:3px solid transparent;margin:0}
  .tabbar button:hover{color:var(--ink)}
  .tabbar button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
  .tabbar svg{display:none}
  main{padding:8px 8px 0}
  h1.large{font-size:40px;margin-top:34px}
  .toast{bottom:32px}
  .poster .faces{height:330px}
  .poster .vs{top:200px;font-size:34px}
  .poster .nm .sur{font-size:72px!important}
  .cgrid{grid-template-columns:repeat(4,minmax(0,1fr));gap:0 20px}
  .cgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chead{grid-template-columns:1fr;min-height:0;padding-right:14px}
  .chead .cimg{width:100%;height:150px;margin-top:-8px}
  .news-top{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;margin:0 16px}
  .news-top .news-lead,.news-top .news-list{margin:0}
  .news-lead h3{font-size:28px}
  .news-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin:24px 16px 0}
  .news-grid .news-lead{margin:0}
  .news-grid .news-lead h3{font-size:17px}
  .sheet{max-width:640px}
}
@media (max-width:899px){.news-grid{display:grid;gap:14px;margin:14px 16px 0}.news-grid .news-lead{margin:0}.news-grid .news-lead h3{font-size:17px}}
@keyframes pulse{50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes viewin{from{opacity:0}}
.poster.enter .halves::before{animation:slideL .7s cubic-bezier(.2,.9,.2,1) both}
.poster.enter .halves::after{animation:slideR .7s cubic-bezier(.2,.9,.2,1) both}
@keyframes slideL{from{transform:translateX(-30%);opacity:0}}
@keyframes slideR{from{transform:translateX(30%);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar" id="topbar">
    <a class="brand" href="#schedule" aria-label="코너 홈"><i></i>CORNER</a>
    <div class="mini" id="miniTitle">일정</div>
    <nav class="tabbar" role="tablist" aria-label="메뉴">
    <button role="tab" aria-selected="true" data-v="schedule" aria-controls="v-schedule"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>일정</button>
    <button role="tab" aria-selected="false" data-v="results" aria-controls="v-results"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L7 5M3.5 12l1.2 1.2L7 11M3.5 18l1.2 1.2L7 17"/></svg>결과</button>
    <button role="tab" aria-selected="false" data-v="news" aria-controls="v-news"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h13v14H6a2 2 0 0 1-2-2z"/><path d="M17 9h3v8a2 2 0 0 1-2 2"/><path d="M8 9h5M8 13h5M8 16h3"/></svg>뉴스</button>
    <button role="tab" aria-selected="false" data-v="champs" aria-controls="v-champs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 9.5h19v5h-19z"/><rect x="8.5" y="8" width="7" height="8" rx="1.5"/><circle cx="12" cy="12" r="1.6"/><path d="M5 14.5v2.5M19 14.5v2.5"/></svg>챔피언</button>
    <button role="tab" aria-selected="false" data-v="legends" aria-controls="v-legends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.4 6.8 19.1l1-5.8L3.5 9.2l5.9-.8z"/></svg>레전드</button>
    <button role="tab" aria-selected="false" data-v="fighters" aria-controls="v-fighters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg>선수</button>
  </nav>
    <div class="sync" id="sync" role="status" aria-live="polite"><span class="dot"></span><span id="syncText">연결 중</span></div>
    <button class="icon-btn" id="refreshBtn" aria-label="지금 새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
  </header>

  <main>
    <section class="view on" id="v-schedule" aria-labelledby="h-schedule">
      <h1 class="large" id="h-schedule">일정</h1>
      <div class="chips" id="schedOrgs"></div>
      <div id="heroWrap"></div>
      <div id="liveWrap"></div>
      <div id="upcomingWrap"><div class="skeleton" style="margin-top:22px"></div><div class="skeleton"></div><div class="skeleton"></div></div>
      <div id="recentWrap"></div>
    </section>

    <section class="view" id="v-results" aria-labelledby="h-results">
      <h1 class="large" id="h-results">결과</h1>
      <p class="sub">2011년부터 15년치 기록. 끝난 경기는 자동으로 반영돼요.</p>
      <div class="chips years" id="years"></div>
      <div class="chips" id="resOrgs"></div>
      <div id="resultsWrap"></div>
    </section>

    <section class="view" id="v-news" aria-labelledby="h-news">
      <h1 class="large" id="h-news">뉴스</h1>
      <p class="sub" id="newsSub">UFC 한국어 공식 사이트의 최신 기사예요. 누르면 원문으로 이동해요.</p>
      <div id="newsWrap"><div class="skeleton" style="height:220px"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    </section>

    <section class="view" id="v-champs" aria-labelledby="h-champs">
      <h1 class="large" id="h-champs">챔피언</h1>
      <p class="sub">체급별 현 챔피언과 랭킹. 벨트 주인이 바뀌면 자동으로 반영돼요.</p>
      <div class="seg" id="chSeg" role="group" aria-label="종목">
        <button aria-pressed="true" data-k="ufc">UFC</button><button aria-pressed="false" data-k="bc">블랙컴뱃</button><button aria-pressed="false" data-k="boxing">복싱</button>
      </div>
      <div id="champWrap"></div>
    </section>

    <section class="view" id="v-legends" aria-labelledby="h-legends">
      <h1 class="large" id="h-legends">레전드 매치</h1>
      <p class="sub" id="legendSub"></p>
      <div class="seg" id="legendSeg" role="group" aria-label="종목">
        <button aria-pressed="true" data-k="all">전체</button><button aria-pressed="false" data-k="mma">MMA</button><button aria-pressed="false" data-k="boxing">복싱</button>
      </div>
      <div id="legendWrap"></div>
    </section>

    <section class="view" id="v-fighters" aria-labelledby="h-fighters">
      <h1 class="large" id="h-fighters">선수</h1>
      <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="이름, 별명, 체급으로 찾기" aria-label="선수 검색" autocomplete="off"></div>
      <div class="seg" id="fSeg" role="group" aria-label="분류">
        <button aria-pressed="true" data-k="all">전체</button><button aria-pressed="false" data-k="mma">MMA</button><button aria-pressed="false" data-k="boxing">복싱</button><button aria-pressed="false" data-k="fav">즐겨찾기</button>
      </div>
      <div id="fightersWrap"></div>
    </section>
  </main>

</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="grab"></div>
  <div class="sh"><div class="ttl" id="sheetTitle"></div><button class="icon-btn" id="sheetClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
  <div class="body" id="sheetBody"></div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
